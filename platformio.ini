; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno

; Shared settings for every Arduino Uno build.
[avr]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
test_ignore = test_board
lib_deps =
  adafruit/Adafruit GFX Library@^1.13.0
  adafruit/Adafruit ILI9341@^1.7.0
  dfrobot/DFRobotDFPlayerMini@^1.0.6
  worldfamouselectronics/PulseSensor Playground@^2.5.0

; The game: pio run -e uno -t upload
[env:uno]
extends = avr
build_src_filter = +<*> -<stages/>

; Stage test sketches: shared modules + one entry file from src/stages/.
; Upload with: pio run -e test_display -t upload
[env:test_display]
extends = avr
build_src_filter = +<*> -<main.cpp> -<stages/> +<stages/test_display.cpp>

; Screen wiring probe (debug aid): pio run -e probe_pins -t upload
[env:probe_pins]
extends = avr
build_src_filter = -<*> +<stages/probe_pins.cpp>

; Screen diagnostic at slow SPI (debug aid): pio run -e screen_diag -t upload
[env:screen_diag]
extends = avr
build_src_filter = -<*> +<stages/screen_diag.cpp>

; Host unit tests for the pure board logic: pio test -e native
[env:native]
platform = native
build_src_filter = -<*> +<board.cpp>
test_build_src = yes
test_filter = test_board
build_flags = -std=c++11 -Wall -Wextra
